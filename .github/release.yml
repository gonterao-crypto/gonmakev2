# .github/release.yml

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - octocat
  categories:
    - title: 重大な変更
      labels:
        - judai
    - title: バグ修正
      labels:
        - bug
    - title: 新機能
      labels:
        - enhancement
    - title: 整理
      labels:
        - refactoring
    - title: そのほかの変更
      labels:
        - "*"